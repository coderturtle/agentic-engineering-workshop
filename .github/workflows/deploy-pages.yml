name: Deploy build log to GitHub Pages

# Human Gate: first deploy is workflow_dispatch-only, run on explicit human confirmation.
# Once that first deploy is confirmed working, uncomment the push trigger below so
# subsequent build-log updates auto-publish.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths:
  #     - "site/**"
  #     - "docs/build-log/**"
  #     - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      # Corrected 2026-07-04, found against a real deploy: setting Pages
      # enablement or the custom domain via the API (PUT /repos/{owner}/{repo}/pages)
      # needs repo-administration-level access. The default GITHUB_TOKEN cannot
      # get this under any `permissions:` grant - `administration` isn't even a
      # valid GITHUB_TOKEN permission scope (only contents/pages/id-token/etc.
      # are; a workflow declaring it fails to parse at all, 422 on dispatch).
      # Both Pages enablement and the custom domain (cname) are therefore
      # one-time, human-run steps (`gh api --method PUT repos/{owner}/{repo}/pages
      # -f cname=... -f build_type=workflow`, using the human's own authenticated
      # session, not a workflow token) - already done for this repo. CI's job is
      # build + deploy only, never repo-settings changes.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Best-effort only: GitHub issues the Pages TLS cert asynchronously once
      # the CNAME record resolves publicly, so this never blocks or fails the
      # deploy - it just surfaces current status in the run log.
      - name: Check HTTPS enforcement status (best-effort, non-blocking)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq \
            '"https_enforced=" + (.https_enforced | tostring) + " status=" + .status' \
            || echo "Could not read Pages status yet (DNS/cert may still be propagating)."
