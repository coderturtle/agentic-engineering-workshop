name: Deploy build log to GitHub Pages

# Human Gate: first deploy is workflow_dispatch-only, run on explicit human confirmation.
# Once that first deploy is confirmed working, uncomment the push trigger below so
# subsequent build-log updates auto-publish.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths:
  #     - "site/**"
  #     - "docs/build-log/**"
  #     - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  # PUT /repos/{owner}/{repo}/pages (setting the custom domain, and the very
  # first Pages enablement) needs repo-administration access, not just
  # pages:write - that only covers deployments. Without this, the default
  # GITHUB_TOKEN gets "Resource not accessible by integration" (403).
  administration: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build site
        run: npm run build
        working-directory: site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Sets the custom domain (terminal-velocity.coderturtle.io) declared in
      # site/public/CNAME so the repo's Pages settings match the built site,
      # with no manual Settings -> Pages console step. Idempotent: safe to
      # rerun every deploy. The Route53 CNAME record itself is Terraform,
      # applied by a human via the agentic-infra-lab Infrastructure Gremlin
      # (see .hekton/project.yaml's `deployment` block) - this step only
      # configures the GitHub side, which is outside that gate's boundary.
      - name: Configure custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f cname='terminal-velocity.coderturtle.io' \
            -f build_type='workflow' \
            --silent

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Best-effort only: GitHub issues the Pages TLS cert asynchronously once
      # the CNAME record resolves publicly, so this never blocks or fails the
      # deploy - it just surfaces current status in the run log.
      - name: Check HTTPS enforcement status (best-effort, non-blocking)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" --jq \
            '"https_enforced=" + (.https_enforced | tostring) + " status=" + .status' \
            || echo "Could not read Pages status yet (DNS/cert may still be propagating)."
