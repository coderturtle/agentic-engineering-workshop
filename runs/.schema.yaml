# Machine-readable run ledger schema.
# Read by hekton-status and cross-project dashboard aggregators.
# Scaffolded 2026-07-03, run standardise-runs-ledger.py --project terminal-velocity --force to enrich.
schema_version: "1"
project: terminal-velocity
project_type: factory-output
id_prefix: AEW
task_types:
  - task
  - review
  - session
  - exercise
run_description: "A unit of work in Terminal Velocity that produces a traceable result requiring human review."
fields:
  run_id: string
  project: string
  task_id: string
  task_type: string
  engine: string
  status: "done | pending-response | in-progress | failed | abandoned"
  created: date
  human_confirmed: boolean
  human_notes: string
  output_artifact: string
  failure_reason: string
  # Added 2026-07-04 for task_type: exercise entries (the agent-native module-manifest
  # pilot, docs/agent-native-interaction-plan.md §5). Optional for task_type: task/review/session.
  module_id: "string, optional"            # which module's exercise this attempt is against, e.g. "03-harness-engineering"
  attempt_driver: "human | agent | mixed, optional"  # who drove the attempt; changes what human_confirmed: true must mean (see docs/agent-native-interaction-plan.md §3, Q2), for attempt_driver: agent, human_confirmed: true means "I can explain why this passes," not "an artifact exists"
  rubric_scores: "list of {criterion, result}, optional"  # per-criterion result against the module's manifest rubric
  coachgremlin_assessment: "string, optional"  # the grader persona's recommendation and next step; never a claim of certification, that's human_confirmed's job alone
