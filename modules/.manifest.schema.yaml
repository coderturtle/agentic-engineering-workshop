# Machine-readable module-manifest schema.
# Same convention as runs/.schema.yaml: this file documents the shape a
# per-module module.yaml must follow; it is not itself executable. A module's
# module.yaml sits beside its README.md as the parseable counterpart to that
# prose, see docs/agent-native-interaction-plan.md §5 and
# site/src/content/config.ts for the "schema beside prose, one source of
# truth" pattern this imitates. The README remains the human-readable source;
# module.yaml must mirror its gate and question without drift, never invent
# its own version of either.
schema_version: "1"
project: terminal-velocity

fields:
  schema_version: string
  module_id: string          # e.g. "03-harness-engineering", matches the module's directory name
  question: string           # must match the module's README "question this module answers" verbatim

  arc_position:
    prior: "string | null"   # module_id of the preceding module, null if first
    next: "string | null"    # module_id of the following module, null if last
    hinge: boolean            # true only for the module docs/workshop-design.md names as the structural/behavioral turn

  gate: string                # the "required to advance" line, verbatim from the README's arc table

  rubric:                     # list of {criterion, observable, weight}; must cover the same ground as the README's Rubric section, not a parallel invention
    - criterion: string
      observable: string       # what evidence proves this criterion, not a restatement of the criterion
      weight: "scored | gate | gate_and_scored"  # "gate" criteria block advancement outright; "scored" criteria are graded but not individually blocking; "gate_and_scored" is both at once (added 2026-07-04: a plain "gate" was silently collapsing a README criterion that's explicitly both, per the Workshop Review Panel's Module 03 scoped re-run)

  stop_condition: string      # verbatim or equivalent to the README's "Required to advance / stop condition" section

  expected_artifacts:         # list of {kind, description}
    - kind: string             # e.g. harness-config, run-transcript, written-defense
      description: string

  submission:
    ledger_dir: string          # relative path, e.g. "runs/"
    id_prefix: string           # matches runs/.schema.yaml's id_prefix
    driver_field: string        # name of the field on the run entry recording who drove the attempt (see runs/.schema.yaml's attempt_driver)

  human_gate:
    non_delegation_clause: string   # per-module statement of what the human must have done themselves, even if an agent drives the rest (docs/agent-native-interaction-plan.md §3, Q3)
    attestation_requirement: string  # what human_confirmed: true must mean for this module, understanding, not just an artifact existing (§3, Q2)

# Hard rules for anything that reads or writes a module.yaml:
# - A module.yaml never emits or implies a terminal "complete"/"certified" state.
#   Only a human flipping human_confirmed in the run ledger does that.
# - No module.yaml exists without a README.md beside it; the manifest is
#   validated against the README's own gate/question text, not maintained
#   independently. If they diverge, the README is the defect to fix, or the
#   manifest is, decide which, but never let both stand.
