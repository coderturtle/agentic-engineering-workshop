# Machine-readable manifest for Module 03, validated against modules/.manifest.schema.yaml.
# Mirrors README.md's gate, question, and Rubric section verbatim, do not let this file and
# the README diverge; if you change one, change the other in the same commit.
schema_version: "1"
module_id: "03-harness-engineering"
question: "What can it reach, and how is the work organized?"

arc_position:
  prior: "02-context-engineering"
  next: "04-loop-engineering"
  hinge: true  # this is the module docs/workshop-design.md names as the structural/behavioral turn

gate: "A harness config that actually runs, with a transcript"

rubric:
  - criterion: "Bounded reach"
    observable: "The config grants only the access the task needs; over-broad access (full-repo write, running the whole suite, network) is scoped out, and the boundary is explicit in the sub-agent's own definition, not just followed by luck. Verify by checking what's outside the granted scope, not just what's inside it, a git status or directory listing beyond the allowed path should show nothing touched."
    weight: scored
  - criterion: "Sub-agent/specialist boundary"
    observable: "A named specialist with a stated single responsibility, not a monolith asked to do everything."
    weight: scored
  - criterion: "Persistent state survives reset"
    observable: "On-disk state exists; a demonstrated context reset (a genuinely new session with no conversational memory of the first) resumes from it and completes correctly. The notes must describe state and reasoning, not contain a finished, copy-pasteable answer: if the second session's job is just to transcribe what the first session already wrote in full, this criterion is staged, not demonstrated."
    weight: gate_and_scored
  - criterion: "Actually ran"
    observable: "Transcript shows the configured harness executing the task correctly, not just described. Self-reported success isn't enough; the result should be independently reproducible from the transcript's own evidence (diffs, command output)."
    weight: gate
  - criterion: "Isolation, conditional"
    observable: "If worktrees are used, experimental work does not collide with the main checkout. Not required, a plain isolated working copy satisfies the exercise if a worktree isn't used."
    weight: scored
  - criterion: "Reusable generality"
    observable: "The config is not hard-wired to one path in a way that cannot transfer to a real project."
    weight: scored

stop_condition: >-
  Configure a working harness setup (defined tool access, a sub-agent or specialist boundary,
  persistent state across a context reset) for the --by-category task, and demonstrate it actually
  running correctly across a real reset-and-resume, not just described. Submitted harness config
  plus a real run transcript, checked against the rubric above. Reading this module does not count:
  you advance on a harness that actually ran, not on having read this page. The reset-and-resume must
  be demonstrated, not asserted: independently confirm the second session's starting state (diff the
  working copy against the first session's stopping point), and check, for real, whether the second
  session's success actually depended on the notes file, not just whether it read them.

expected_artifacts:
  - kind: harness-config
    description: "A real sub-agent/specialist or harness-config definition (e.g. a .claude/agents/*.md file, an MCP server config, or your harness's equivalent) scoped to the --by-category task."
  - kind: run-transcript
    description: "A chronological record of the harness actually running: your own session log or terminal history, or, if your harness doesn't expose a raw tool-call log, a real-time action record the agent writes as it works (not a summary written after the fact)."
  - kind: reset-resume-evidence
    description: "A diff or equivalent independently confirming the second session's starting state matched the first session's stopping point, plus the result of rerunning phase 2 once more with the notes file withheld."

submission:
  ledger_dir: "runs/"
  id_prefix: "AEW"
  driver_field: "attempt_driver"

human_gate:
  non_delegation_clause: >-
    None specific to this module beyond the general rule: whoever's name is on the attempt must
    have made the actual design decisions (what to scope in/out, where state lives, how the reset
    is verified), even if an agent typed the config or ran the reset-and-resume. Module 03 is one of
    the strongest-fit modules for agent-native interaction (docs/agent-native-interaction-plan.md
    §3, Q3) precisely because the skill here is orchestration and verification, not authorship of a
    single turn, but "I asked my agent to build a harness" without reviewing what it scoped in and
    out still isn't the exercise.
  attestation_requirement: >-
    human_confirmed: true means "I reviewed the harness config, understand exactly what it can and
    cannot reach, and independently confirmed the reset-and-resume evidence myself (not just read
    that the agent said it worked)." It does not mean "a config file and a transcript exist."
